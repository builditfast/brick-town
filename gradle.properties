#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx2048M

#Gradle
org.gradle.jvmargs=-Xmx2048M -Dfile.encoding=UTF-8

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true

#Ktor
io.ktor.development=true

#Kotlin/Native
# Lets a non-Mac host compile the iosMain source set to a klib, so the iOS half
# of shared code is proven on Linux CI. Linking a framework still needs macOS.
kotlin.native.enableKlibsCrossCompilation=true

#House checks
# kmp-doctor runs after every assembleDebug (composeApp/build.gradle.kts). The
# template skips app-name and launcher-icon because its name and stock icon are
# its own; a new app turns app-name back on. The
# icon is checked before handover (build-mobile-app step 7), not in every build.
kmpDoctorSkip=deps,server-host,launcher-icon
