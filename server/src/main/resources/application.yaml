# Ktor's YAML loader wants "$VAR:default", NOT the HOCON ${VAR:default}
# form. With braces it dies at startup on
#   NoSuchElementException: Char sequence is empty
# before a single line of application code runs.
ktor:
  deployment:
    port: "$PORT:8080"
    host: 0.0.0.0
  application:
    modules:
      - ai.freeapp.bricktown.ApplicationKt.module

database:
  url: "$DATABASE_URL:jdbc:postgresql://localhost:5432/app"
  user: "$DATABASE_USER:app"
  password: "$DATABASE_PASSWORD:app"
  maxPoolSize: "$DATABASE_MAX_POOL_SIZE:10"

# Empty defaults are filled in by AppConfig, which also refuses to start with
# APP_ENV=production and no real JWT_SECRET.
app:
  env: "$APP_ENV:development"
  name: "$APP_NAME:"
  contactEmail: "$CONTACT_EMAIL:"
  companyName: "$COMPANY_NAME:"

jwt:
  secret: "$JWT_SECRET:"

# The owner's feature switches. Empty means /root/.freeapp/flags/<tool>.json,
# the file the `flag` CLI writes on this box.
flags:
  statePath: "$FLAGS_STATE_PATH:"
