# NOTE, 2026-08-08. Two version pins below are load-bearing, not preferences.
#
# koin must stay >= 4.1.0 while ktor is on 3.x. koin-ktor 4.0.4 is compiled
# against Ktor 2.3.12, where io.ktor.server.routing.RoutingKt existed; Ktor
# 3.1.3 renamed it to RoutingBuilderKt. Every route that calls Koin's inject()
# then compiles clean and throws NoClassDefFoundError on the FIRST REQUEST,
# including this template's own /items. Nothing catches it at build time.
#
# androidx-lifecycle tracks what Compose Multiplatform actually resolves to.
# Leaving it behind makes kmp-doctor --deps fail every scaffolded project.

[versions]
# Toolchain — pinned to a known-good Kotlin 2.1.x line.
# Bumping to Kotlin 2.3.x requires moving to AGP 9 (which breaks the standard KMP plugin combo)
# and Compose Multiplatform 1.10 (which changed the `compose.*` DSL surface).
# Moving up is one coordinated bump of Kotlin, AGP and Compose Multiplatform.
agp = "8.11.1"
kotlin = "2.1.21"
ksp = "2.1.21-2.0.2"

# Android SDK. Play requires targetSdk 36 for new apps from 2026-08-31, and
# on 36 edge to edge has no opt-out (App.kt consumes the insets at the root).
android-compileSdk = "36"
android-minSdk = "26"
android-targetSdk = "36"

# AndroidX
androidx-activityCompose = "1.10.1"
androidx-appcompat = "1.7.0"
androidx-constraintlayout = "2.2.1"
androidx-core-ktx = "1.15.0"
# Glance 1.1.1 is the newest stable; it needs only compose runtime/ui 1.x and Kotlin 2.0+, so it resolves to the 1.8.2 Compose that CMP 1.8.2 already brings. 1.2.x is alpha/rc.
androidx-glance = "1.1.1"
androidx-espresso-core = "3.6.1"
androidx-lifecycle = "2.9.0-beta01"  # matches what Compose MP 1.8.2 resolves to
androidx-material = "1.12.0"
androidx-test-junit = "1.2.1"

# KMP libraries
compose-multiplatform = "1.8.2"
serialization = "1.8.1"
ktor = "3.1.3"
koin = "4.1.0"        # 4.0.4 is built against Ktor 2.3.12; see NOTE below
sql-delight = "2.0.2"
kotlinx-datetime = "0.6.2"
kotlinx-datetime-ext = "1.3.1"
multiplatform-settings = "1.3.0"
coroutines = "1.10.2"   # what Ktor 3.1.3 and Compose MP 1.8.2 resolve to; kotlinx-coroutines-test must match

# Server libraries
exposed = "0.56.0"
hikaricp = "6.2.1"
postgres = "42.7.4"
flyway = "10.22.0"
logback = "1.5.16"
bcrypt = "0.10.2"
pdfbox = "3.0.5"
embedded-postgres = "2.2.2"
embedded-postgres-binaries = "17.11.0"  # Postgres 17, the major docker-compose.yml runs

# Test
junit = "4.13.2"
robolectric = "4.16.1"
# The androidx Compose that Compose MP 1.8.2 resolves to on Android, so the
# test artifacts raise nothing.
androidx-compose-test = "1.8.2"
# 1.0.1 is the newest qrose built for Kotlin 1.9 / Compose 1.6 metadata; 1.1.0+ ship Kotlin 2.3 metadata
# that the Kotlin 2.1.21 compiler refuses.
qrose = "1.0.1"


[libraries]
qrose = { module = "io.github.alexzhirkevich:qrose", version.ref = "qrose" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlin-test-junit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4", version.ref = "androidx-compose-test" }
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest", version.ref = "androidx-compose-test" }

# AndroidX
androidx-glance-appwidget = { group = "androidx.glance", name = "glance-appwidget", version.ref = "androidx-glance" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "androidx-core-ktx" }
androidx-test-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidx-test-junit" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "androidx-espresso-core" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "androidx-appcompat" }
androidx-material = { group = "com.google.android.material", name = "material", version.ref = "androidx-material" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "androidx-constraintlayout" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activityCompose" }
androidx-lifecycle-viewmodel = { group = "org.jetbrains.androidx.lifecycle", name = "lifecycle-viewmodel", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtime-compose = { group = "org.jetbrains.androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "org.jetbrains.androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
# System back and the predictive back gesture from commonMain (Android: PredictiveBackHandler).
compose-ui-backhandler = { module = "org.jetbrains.compose.ui:ui-backhandler", version.ref = "compose-multiplatform" }

# kotlinx
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime" }
kotlinx-datetime-ext = { module = "com.raedghazal:kotlinx_datetime_ext", version.ref = "kotlinx-datetime-ext" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

# Multiplatform settings (key-value storage on Android + iOS)
multiplatform-settings-no-arg = { module = "com.russhwolf:multiplatform-settings-no-arg", version.ref = "multiplatform-settings" }

# SQLDelight (mobile DB)
sqldelight-runtime = { module = "app.cash.sqldelight:runtime", version.ref = "sql-delight" }
sqldelight-coroutines-extensions = { module = "app.cash.sqldelight:coroutines-extensions", version.ref = "sql-delight" }
sqldelight-android-driver = { module = "app.cash.sqldelight:android-driver", version.ref = "sql-delight" }
sqldelight-native-driver = { module = "app.cash.sqldelight:native-driver", version.ref = "sql-delight" }
sqldelight-sqlite-driver = { module = "app.cash.sqldelight:sqlite-driver", version.ref = "sql-delight" }

# Koin DI
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-android = { module = "io.insert-koin:koin-android", version.ref = "koin" }
koin-compose = { module = "io.insert-koin:koin-compose", version.ref = "koin" }
koin-compose-viewmodel = { module = "io.insert-koin:koin-compose-viewmodel", version.ref = "koin" }
koin-ktor = { module = "io.insert-koin:koin-ktor", version.ref = "koin" }
koin-logger-slf4j = { module = "io.insert-koin:koin-logger-slf4j", version.ref = "koin" }

# Ktor client
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-resources = { module = "io.ktor:ktor-client-resources", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktor-client-logging = { module = "io.ktor:ktor-client-logging", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }

# Ktor server
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-netty = { module = "io.ktor:ktor-server-netty", version.ref = "ktor" }
ktor-server-content-negotiation = { module = "io.ktor:ktor-server-content-negotiation", version.ref = "ktor" }
ktor-server-call-logging = { module = "io.ktor:ktor-server-call-logging", version.ref = "ktor" }
ktor-server-status-pages = { module = "io.ktor:ktor-server-status-pages", version.ref = "ktor" }
ktor-server-cors = { module = "io.ktor:ktor-server-cors", version.ref = "ktor" }
ktor-server-default-headers = { module = "io.ktor:ktor-server-default-headers", version.ref = "ktor" }
ktor-server-config-yaml = { module = "io.ktor:ktor-server-config-yaml", version.ref = "ktor" }
ktor-server-test-host = { module = "io.ktor:ktor-server-test-host", version.ref = "ktor" }
ktor-server-auth = { module = "io.ktor:ktor-server-auth", version.ref = "ktor" }
ktor-server-auth-jwt = { module = "io.ktor:ktor-server-auth-jwt", version.ref = "ktor" }
bcrypt = { module = "at.favre.lib:bcrypt", version.ref = "bcrypt" }
pdfbox = { module = "org.apache.pdfbox:pdfbox", version.ref = "pdfbox" }

# Server DB (Exposed + Postgres + HikariCP + Flyway)
exposed-core = { module = "org.jetbrains.exposed:exposed-core", version.ref = "exposed" }
exposed-jdbc = { module = "org.jetbrains.exposed:exposed-jdbc", version.ref = "exposed" }
exposed-kotlin-datetime = { module = "org.jetbrains.exposed:exposed-kotlin-datetime", version.ref = "exposed" }
hikaricp = { module = "com.zaxxer:HikariCP", version.ref = "hikaricp" }
postgres = { module = "org.postgresql:postgresql", version.ref = "postgres" }
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
flyway-postgres = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway" }

# Throwaway Postgres for server tests and the fat JAR smoke: real binaries, no Docker.
# The library pulls only amd64 binaries; the arm64 ones are listed so Apple
# Silicon and ARM Linux run natively, and the BOM pins every one to the same 17.x.
embedded-postgres = { module = "io.zonky.test:embedded-postgres", version.ref = "embedded-postgres" }
embedded-postgres-binaries-bom = { module = "io.zonky.test.postgres:embedded-postgres-binaries-bom", version.ref = "embedded-postgres-binaries" }
embedded-postgres-binaries-darwin-arm64 = { module = "io.zonky.test.postgres:embedded-postgres-binaries-darwin-arm64v8" }
embedded-postgres-binaries-linux-arm64 = { module = "io.zonky.test.postgres:embedded-postgres-binaries-linux-arm64v8" }

# Logging
logback = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }


[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidLibrary = { id = "com.android.library", version.ref = "agp" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ktor = { id = "io.ktor.plugin", version.ref = "ktor" }
sqlDelight = { id = "app.cash.sqldelight", version.ref = "sql-delight" }
